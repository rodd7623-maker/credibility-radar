name: Build APK for Phone

# Run when you push code OR click "Run workflow" button on GitHub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build APK on EAS
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Done
        run: |
          echo "✅ Build started!"
          echo "📱 Go to https://expo.dev to see your APK download link in ~12 minutes."
